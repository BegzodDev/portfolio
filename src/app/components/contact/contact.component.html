<section id="contact">
  <p class="section-tag">{{ "contact.tag" | transloco }}</p>
  <h2>{{ "contact.title" | transloco }}</h2>
  <p class="lead">{{ "contact.lead" | transloco }}</p>

  <div class="contact-row">
    <div class="contact-card" *ngFor="let item of items">
      <div class="label">{{ item.label | transloco }}</div>
      <div class="value">
        <a [href]="item.href" target="_blank" rel="noopener">{{
          item.value
        }}</a>
      </div>
    </div>
  </div>
</section>
