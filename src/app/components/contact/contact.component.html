<section id="contact">
  <p class="section-tag" appScrollReveal="fade-up">
    {{ "contact.tag" | transloco }}
  </p>
  <h2 appScrollReveal="fade-up" [revealDelay]="80">
    {{ "contact.title" | transloco }}
  </h2>
  <p class="lead" appScrollReveal="fade-up" [revealDelay]="140">
    {{ "contact.lead" | transloco }}
  </p>

  <div class="contact-row">
    <div
      class="contact-card"
      *ngFor="let item of items; let i = index"
      appScrollReveal="scale"
      [revealDelay]="i * 100"
    >
      <div class="label">{{ item.label | transloco }}</div>
      <div class="value">
        <a [href]="item.href" target="_blank" rel="noopener">{{
          item.value
        }}</a>
      </div>
    </div>
  </div>
</section>
