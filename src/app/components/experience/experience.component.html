<section id="contracts">
  <p class="section-tag">{{ "experience.tag" | transloco }}</p>
  <h2>{{ "experience.title" | transloco }}</h2>

  <div class="gitlog">
    <div class="commit" *ngFor="let c of commits">
      <div class="commit-hash">{{ c.hash }}</div>
      <div class="commit-msg">{{ c.msg | transloco }}</div>
      <div class="commit-meta">{{ c.meta | transloco }}</div>
      <div class="commit-body">{{ c.body | transloco }}</div>
    </div>
  </div>
</section>
